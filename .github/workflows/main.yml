name: Deploy to Azure VM

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Get the code
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Set up Java 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Build backend JAR
    - name: Build backend JAR
      run: |
        cd Backend
        chmod +x mvnw
        ./mvnw clean package -DskipTests -B
        ls -la target/

    # 4. Set up Node.js
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: Frontend/package-lock.json

    - name: Install frontend dependencies
      run: |
        cd Frontend
        npm ci

    # 5. Login to Docker Hub
    - name: Login to Docker Hub
      run: |
        echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

    # 6. Build and push backend image
    - name: Build and push backend
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/prescription-backend:latest ./Backend
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/prescription-backend:latest

    # 7. Build and push frontend image
    - name: Build and push frontend
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/prescription-frontend:latest ./Frontend
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/prescription-frontend:latest

    # 8. Deploy to Azure VM
    - name: Deploy to VM
      run: |
        # Create SSH key
        echo "${{ secrets.AZURE_VM_SSH_KEY }}" > key.pem
        chmod 600 key.pem

        # Write docker-compose for the remote server
        cat > remote-compose.yml << 'COMPOSE_EOF'
        version: '3.8'
        services:
          database:
            image: postgres:15-alpine
            container_name: prescription_db
            environment:
              POSTGRES_DB: prescription_system
              POSTGRES_USER: PLACEHOLDER_DB_USERNAME
              POSTGRES_PASSWORD: PLACEHOLDER_DB_PASSWORD
            volumes:
              - postgres_data:/var/lib/postgresql/data
            networks:
              - app-network
            restart: unless-stopped
            healthcheck:
              test: ["CMD-SHELL", "pg_isready -U PLACEHOLDER_DB_USERNAME -d prescription_system"]
              interval: 30s
              timeout: 10s
              retries: 3

          backend:
            image: PLACEHOLDER_DOCKERHUB_USERNAME/prescription-backend:latest
            container_name: prescription_backend
            environment:
              SPRING_PROFILES_ACTIVE: docker
              SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/prescription_system
              SPRING_DATASOURCE_USERNAME: PLACEHOLDER_DB_USERNAME
              SPRING_DATASOURCE_PASSWORD: PLACEHOLDER_DB_PASSWORD
              SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
              SPRING_DATASOURCE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
              SPRING_JPA_HIBERNATE_DDL_AUTO: update
              SPRING_JPA_SHOW_SQL: "false"
              SERVER_PORT: 8080
              JWT_SECRET: PLACEHOLDER_JWT_SECRET
              SPRING_MAIL_USERNAME: PLACEHOLDER_MAIL_USERNAME
              SPRING_MAIL_PASSWORD: PLACEHOLDER_MAIL_PASSWORD
              R2_ACCOUNT_ID: PLACEHOLDER_R2_ACCOUNT_ID
              R2_ACCESS_KEY_ID: PLACEHOLDER_R2_ACCESS_KEY_ID
              R2_SECRET_ACCESS_KEY: PLACEHOLDER_R2_SECRET_ACCESS_KEY
              R2_BUCKET: PLACEHOLDER_R2_BUCKET
              R2_PUBLIC_URL: PLACEHOLDER_R2_PUBLIC_URL
              CORS_ALLOWED_ORIGINS: PLACEHOLDER_CORS
            ports:
              - "8080:8080"
            depends_on:
              database:
                condition: service_healthy
            networks:
              - app-network
            restart: unless-stopped

          frontend:
            image: PLACEHOLDER_DOCKERHUB_USERNAME/prescription-frontend:latest
            container_name: prescription_frontend
            ports:
              - "3000:80"
            depends_on:
              - backend
            networks:
              - app-network
            restart: unless-stopped

        volumes:
          postgres_data:

        networks:
          app-network:
            driver: bridge
        COMPOSE_EOF

        # Substitute placeholders with actual secrets
        sed -i "s|PLACEHOLDER_DB_USERNAME|${{ secrets.DB_USERNAME }}|g" remote-compose.yml
        sed -i "s|PLACEHOLDER_DB_PASSWORD|${{ secrets.DB_PASSWORD }}|g" remote-compose.yml
        sed -i "s|PLACEHOLDER_JWT_SECRET|${{ secrets.JWT_SECRET }}|g" remote-compose.yml
        sed -i "s|PLACEHOLDER_MAIL_USERNAME|${{ secrets.SPRING_MAIL_USERNAME }}|g" remote-compose.yml
        sed -i "s|PLACEHOLDER_MAIL_PASSWORD|${{ secrets.SPRING_MAIL_PASSWORD }}|g" remote-compose.yml
        sed -i "s|PLACEHOLDER_R2_ACCOUNT_ID|${{ secrets.R2_ACCOUNT_ID }}|g" remote-compose.yml
        sed -i "s|PLACEHOLDER_R2_ACCESS_KEY_ID|${{ secrets.R2_ACCESS_KEY_ID }}|g" remote-compose.yml
        sed -i "s|PLACEHOLDER_R2_SECRET_ACCESS_KEY|${{ secrets.R2_SECRET_ACCESS_KEY }}|g" remote-compose.yml
        sed -i "s|PLACEHOLDER_R2_BUCKET|${{ secrets.R2_BUCKET }}|g" remote-compose.yml
        sed -i "s|PLACEHOLDER_R2_PUBLIC_URL|${{ secrets.R2_PUBLIC_URL }}|g" remote-compose.yml
        sed -i "s|PLACEHOLDER_DOCKERHUB_USERNAME|${{ secrets.DOCKERHUB_USERNAME }}|g" remote-compose.yml
        sed -i "s|PLACEHOLDER_CORS|http://${{ secrets.AZURE_VM_HOST }}:3000|g" remote-compose.yml

        # Prepare remote server
        ssh -i key.pem -o StrictHostKeyChecking=no ${{ secrets.AZURE_VM_USERNAME }}@${{ secrets.AZURE_VM_HOST }} \
          "mkdir -p ~/prescription-app && echo '${{ secrets.DOCKERHUB_TOKEN }}' | docker login -u '${{ secrets.DOCKERHUB_USERNAME }}' --password-stdin"

        # Copy compose file
        scp -i key.pem -o StrictHostKeyChecking=no remote-compose.yml \
          ${{ secrets.AZURE_VM_USERNAME }}@${{ secrets.AZURE_VM_HOST }}:~/prescription-app/docker-compose.yml

        # Pull images and deploy
        ssh -i key.pem -o StrictHostKeyChecking=no ${{ secrets.AZURE_VM_USERNAME }}@${{ secrets.AZURE_VM_HOST }} << 'DEPLOY_EOF'
          cd ~/prescription-app
          docker compose pull
          docker compose down
          docker compose up -d
          sleep 20
          docker compose ps
          echo "Deployment completed!"
          echo "Frontend: http://${{ secrets.AZURE_VM_HOST }}:3000"
          echo "Backend:  http://${{ secrets.AZURE_VM_HOST }}:8080"
        DEPLOY_EOF

        # Clean up
        rm -f key.pem remote-compose.yml
